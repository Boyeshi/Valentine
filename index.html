<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine? 💕</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="content" id="question-section">
            <h1>Will you be my Valentine? 💖</h1>
            <p class="subtitle">Please say yes! 🥺</p>
            <div class="button-container">
                <button id="yes-btn" class="btn yes-btn">Yes! 💕</button>
                <button id="no-btn" class="btn no-btn">No 😢</button>
            </div>
        </div>
        
        <div class="content hidden" id="success-section">
            <h1>Yay! 🎉💖✨</h1>
            <p class="success-message">I'm so happy! You made my day! 😊</p>
            <p class="hearts">❤️ 💕 💖 💗 💓 💝</p>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
